name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Don't let the action install the removed "tools" package (it fails
          # on newer cmdline-tools); we install exactly what we need below.
          packages: ""
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key so new builds install over old ones.
      # Add repository secrets MN_KEYSTORE_BASE64, MN_KEYSTORE_PASSWORD,
      # MN_KEY_ALIAS and MN_KEY_PASSWORD. Without them the debug key is used.
      - name: Decode signing key
        env:
          MN_KEYSTORE_BASE64: ${{ secrets.MN_KEYSTORE_BASE64 }}
        if: env.MN_KEYSTORE_BASE64 != ''
        run: |
          echo "$MN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MN_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build release APK
        env:
          MN_KEYSTORE_PASSWORD: ${{ secrets.MN_KEYSTORE_PASSWORD }}
          MN_KEY_ALIAS: ${{ secrets.MN_KEY_ALIAS }}
          MN_KEY_PASSWORD: ${{ secrets.MN_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk MetroNudge.apk
          du -h MetroNudge.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MetroNudge
          path: MetroNudge.apk

      # Every push to main publishes a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/MetroNudge.apk
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MetroNudge build ${{ github.run_number }} (${{ github.sha }})
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: MetroNudge.apk
